services:
  - type: web
    name: vyavsay
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: VYAVSAY_DEMO_MODE
        value: "true"
